<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>86</title>
    <meta name="description" content="86. Why?">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #000;
            color: #fff;
            font-family: "Space Mono", monospace;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* =========================
           MAIN LAYOUT
        ========================= */

        .page {
            width: 100%;
            height: 100vh;
            min-height: 600px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;

            padding: 38px 24px 30px;
            position: relative;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            text-align: center;
            z-index: 2;
        }

        .code {
            color: #444;
            font-size: 11px;
            letter-spacing: 5px;
            margin-bottom: 7px;
            transition: color 0.4s ease;
        }

        .logo {
            font-size: clamp(58px, 10vw, 92px);
            line-height: 1;
            font-weight: 700;
            letter-spacing: -7px;
        }

        /* =========================
           CENTER
        ========================= */

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            margin-top: -20px;
            z-index: 2;
        }

        /* =========================
           COUNTER
        ========================= */

        .counter {
            font-size: 13px;
            color: #777;
            letter-spacing: 3px;
            margin-bottom: 32px;
        }

        .counter span {
            color: #ddd;
        }

        /* =========================
           BUTTON
        ========================= */

        .button-wrap {
            position: relative;
            width: 230px;
            height: 230px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shockwave {
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 1px solid rgba(255, 0, 0, 0);
            pointer-events: none;
        }

        .press-button {
            width: 190px;
            height: 190px;

            border-radius: 50%;
            border: 2px solid #ff3333;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #ff5a5a 0%,
                    #f00000 35%,
                    #bd0000 70%,
                    #800000 100%
                );

            color: white;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow:
                0 0 30px rgba(255, 0, 0, 0.28),
                0 0 90px rgba(255, 0, 0, 0.12),
                inset 0 3px 12px rgba(255,255,255,0.25),
                inset 0 -10px 20px rgba(0,0,0,0.3);

            transition:
                transform 0.08s ease,
                box-shadow 0.15s ease;
        }

        .press-button:hover {
            box-shadow:
                0 0 40px rgba(255, 0, 0, 0.45),
                0 0 110px rgba(255, 0, 0, 0.16),
                inset 0 3px 12px rgba(255,255,255,0.25),
                inset 0 -10px 20px rgba(0,0,0,0.3);
        }

        .press-button:active {
            transform: scale(0.91);
        }

        .press-label {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 5px;
            margin-left: 5px;
        }

        /* =========================
           MYSTERY MESSAGE
        ========================= */

        .message {
            height: 25px;
            margin-top: 28px;

            color: #ff3030;
            font-size: 10px;
            letter-spacing: 3px;

            text-align: center;

            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .message.visible {
            opacity: 1;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            width: 100%;
            text-align: center;
            z-index: 2;
        }

        .world {
            font-size: 11px;
            color: #555;
            letter-spacing: 3px;
            margin-bottom: 18px;
        }

        .world strong {
            color: #aaa;
            font-weight: 400;
        }

        .why {
            display: inline-block;

            color: #333;
            font-size: 10px;
            letter-spacing: 3px;

            text-decoration: none;

            border-bottom: 1px dotted #333;
            padding-bottom: 3px;

            transition:
                color 0.3s ease,
                border-color 0.3s ease;
        }

        .why:hover {
            color: #aaa;
            border-color: #aaa;
        }

        /* =========================
           SCREEN FLASH
        ========================= */

        .flash {
            position: fixed;
            inset: 0;

            background: rgba(255, 0, 0, 0.12);

            opacity: 0;
            pointer-events: none;

            z-index: 10;
        }

        .flash.active {
            animation: flash 0.18s ease-out;
        }

        @keyframes flash {
            0%   { opacity: 1; }
            100% { opacity: 0; }
        }

        /* =========================
           BUTTON IMPACT
        ========================= */

        .shockwave.active {
            animation: shockwave 0.55s ease-out;
        }

        @keyframes shockwave {
            0% {
                width: 180px;
                height: 180px;
                border-color: rgba(255,0,0,0.7);
                opacity: 1;
            }

            100% {
                width: 330px;
                height: 330px;
                border-color: rgba(255,0,0,0);
                opacity: 0;
            }
        }

        /* =========================
           MILESTONE SCREEN
        ========================= */

        .overlay {
            position: fixed;
            inset: 0;

            background: rgba(0,0,0,0.97);

            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 20;

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.5s ease,
                visibility 0.5s ease;
        }

        .overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .overlay-content {
            text-align: center;
            padding: 30px;
        }

        .overlay-number {
            color: #444;
            font-size: 11px;
            letter-spacing: 5px;
            margin-bottom: 25px;
        }

        .overlay-title {
            font-size: clamp(25px, 5vw, 48px);
            letter-spacing: 2px;
            font-weight: 700;
        }

        .overlay-subtitle {
            margin-top: 20px;
            color: #666;
            font-size: 11px;
            letter-spacing: 3px;
        }

        .close {
            margin-top: 45px;

            background: transparent;
            border: none;

            color: #444;

            font-family: inherit;
            font-size: 10px;
            letter-spacing: 3px;

            cursor: pointer;

            transition: color 0.3s ease;
        }

        .close:hover {
            color: white;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .page {
                padding-top: 28px;
                padding-bottom: 24px;
            }

            .button-wrap {
                width: 210px;
                height: 210px;
            }

            .press-button {
                width: 175px;
                height: 175px;
            }

            main {
                margin-top: -10px;
            }

            .counter {
                margin-bottom: 26px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <!-- =========================
         HEADER
    ========================== -->

    <header>
        <div id="code" class="code">86 &lt; 86</div>
        <div class="logo">86</div>
    </header>


    <!-- =========================
         CENTER
    ========================== -->

    <main>

        <div class="counter">
            <span id="total">12,482,931</span> PRESSES
        </div>

        <div class="button-wrap">

            <div id="shockwave" class="shockwave"></div>

            <button
                id="pressButton"
                class="press-button"
                aria-label="Press the button"
            >
                <span class="press-label">PRESS</span>
            </button>

        </div>

        <div id="message" class="message"></div>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <div class="world">
            <strong id="today">12,482,931</strong> PRESSES TODAY
        </div>

        <a href="#" id="why" class="why">
            WHY 86?
        </a>

    </footer>

</div>


<!-- SCREEN FLASH -->

<div id="flash" class="flash"></div>


<!-- =========================
     WHY 86 OVERLAY
========================== -->

<div id="overlay" class="overlay">

    <div class="overlay-content">

        <div class="overlay-number">
            86
        </div>

        <div class="overlay-title">
            WHY?
        </div>

        <div class="overlay-subtitle">
            THERE IS NO ANSWER.
        </div>

        <button id="close" class="close">
            CLOSE
        </button>

    </div>

</div>


<script>

    /* ==========================================
       INITIAL STATE
    ========================================== */

    let userClicks = 0;

    // Temporary demo value.
    // Later this will come from the global database.
    let worldClicks = 12482931;


    /* ==========================================
       ELEMENTS
    ========================================== */

    const button = document.getElementById("pressButton");

    const total = document.getElementById("total");
    const today = document.getElementById("today");

    const message = document.getElementById("message");

    const code = document.getElementById("code");

    const flash = document.getElementById("flash");
    const shockwave = document.getElementById("shockwave");

    const why = document.getElementById("why");
    const overlay = document.getElementById("overlay");
    const closeBtn = document.getElementById("close");


    /* ==========================================
       FORMAT NUMBER
    ========================================== */

    function formatNumber(number) {
        return number.toLocaleString("en-US");
    }


    /* ==========================================
       SHOW MESSAGE
    ========================================== */

    function showMessage(text) {

        message.textContent = text;

        message.classList.remove("visible");

        // Force animation restart
        void message.offsetWidth;

        message.classList.add("visible");

    }


    /* ==========================================
       BUTTON PRESS
    ========================================== */

    button.addEventListener("click", () => {

        userClicks++;
        worldClicks++;

        total.textContent = formatNumber(worldClicks);
        today.textContent = formatNumber(worldClicks);


        /* SCREEN FLASH */

        flash.classList.remove("active");

        void flash.offsetWidth;

        flash.classList.add("active");


        /* SHOCKWAVE */

        shockwave.classList.remove("active");

        void shockwave.offsetWidth;

        shockwave.classList.add("active");


        /* ======================================
           MYSTERY EVENTS
        ====================================== */

        if (userClicks === 10) {

            showMessage("86 IS NOT A NUMBER.");

        }

        else if (userClicks === 25) {

            showMessage("YOU WERE NOT SUPPOSED TO NOTICE.");

        }

        else if (userClicks === 50) {

            showMessage("50 WAS NOT THE TARGET.");

        }

        else if (userClicks === 86) {

            showMessage("YOU FOUND IT.");

            code.textContent = "86 = 86";

            setTimeout(() => {

                overlay.classList.add("open");

            }, 900);

        }

        else if (userClicks === 120) {

            showMessage("THERE IS NO 120.");

        }

        else if (userClicks > 86 && userClicks % 50 === 0) {

            showMessage("THE NUMBER CONTINUES.");

        }

    });


    /* ==========================================
       DEMO GLOBAL ACTIVITY
       
       ONLY FOR THE PROTOTYPE.
       Replace with API/database later.
    ========================================== */

    setInterval(() => {

        const randomActivity =
            Math.floor(Math.random() * 3) + 1;

        worldClicks += randomActivity;

        total.textContent = formatNumber(worldClicks);
        today.textContent = formatNumber(worldClicks);

    }, 3500);


    /* ==========================================
       WHY 86
    ========================================== */

    why.addEventListener("click", (event) => {

        event.preventDefault();

        overlay.classList.add("open");

    });


    /* ==========================================
       CLOSE OVERLAY
    ========================================== */

    closeBtn.addEventListener("click", () => {

        overlay.classList.remove("open");

    });


    /* ==========================================
       ESC KEY
    ========================================== */

    document.addEventListener("keydown", (event) => {

        if (event.key === "Escape") {

            overlay.classList.remove("open");

        }

    });

</script>

</body>
</html>
