<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>86</title>
    <meta name="description" content="86. Why?">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #000;
            color: #fff;
            font-family: "Space Mono", monospace;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* =========================
           MAIN LAYOUT
        ========================= */

        .page {
            width: 100%;
            height: 100vh;
            min-height: 600px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;

            padding: 38px 24px 30px;
            position: relative;

            will-change: transform;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            text-align: center;
            z-index: 2;
        }

        .code {
            color: #aaaaaa;
            font-size: 11px;
            letter-spacing: 5px;
            margin-bottom: 7px;
            transition: color 0.4s ease;
        }

        .logo {
            font-size: clamp(58px, 10vw, 92px);
            line-height: 1;
            font-weight: 700;
            letter-spacing: -7px;
            position: relative;
        }

        /* Chromatic-shift ghost layers for the logo, only shown during the effect */
        .logo-ghost {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            opacity: 0;
            pointer-events: none;
        }

        .logo-ghost.cyan {
            color: #00e5ff;
        }

        .logo-ghost.red {
            color: #ff2b2b;
        }

        .logo-ghost.active.cyan {
            animation: chromaCyan 0.65s ease-out;
        }

        .logo-ghost.active.red {
            animation: chromaRed 0.65s ease-out;
        }

        @keyframes chromaCyan {
            0% {
                opacity: 0.85;
                transform: translate(-4px, 1px);
            }

            100% {
                opacity: 0;
                transform: translate(0, 0);
            }
        }

        @keyframes chromaRed {
            0% {
                opacity: 0.85;
                transform: translate(4px, -1px);
            }

            100% {
                opacity: 0;
                transform: translate(0, 0);
            }
        }

        /* =========================
           CENTER
        ========================= */

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            margin-top: -20px;
            z-index: 2;
        }

        /* =========================
           COUNTER
        ========================= */

        .counter {
            font-size: 13px;
            color: #aaaaaa;
            letter-spacing: 3px;
            margin-bottom: 32px;
        }

        .counter span {
            color: #aaaaaa;
        }

        /* =========================
           BUTTON
        ========================= */

        .button-wrap {
            position: relative;
            width: 230px;
            height: 230px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .press-button {
            width: 190px;
            height: 190px;

            border-radius: 50%;
            border: 2px solid #ff3333;

            background:
                radial-gradient(circle at 35% 30%,
                    #ff5a5a 0%,
                    #f00000 35%,
                    #bd0000 70%,
                    #800000 100%);

            color: white;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow:
                0 0 30px rgba(255, 0, 0, 0.28),
                0 0 90px rgba(255, 0, 0, 0.12),
                inset 0 3px 12px rgba(255, 255, 255, 0.25),
                inset 0 -10px 20px rgba(0, 0, 0, 0.3);

            transition:
                transform 0.08s ease,
                box-shadow 0.15s ease,
                background 0.4s ease,
                border-color 0.4s ease;
        }

        .press-button:hover {
            box-shadow:
                0 0 40px rgba(255, 0, 0, 0.45),
                0 0 110px rgba(255, 0, 0, 0.16),
                inset 0 3px 12px rgba(255, 255, 255, 0.25),
                inset 0 -10px 20px rgba(0, 0, 0, 0.3);
        }

        .press-button:active {
            transform: scale(0.91);
        }

        /* Frame 0-140ms: button collapses to black before the break */
        .press-button.collapsing {
            background: #000;
            border-color: #000;
            transform: scale(0.86);
            box-shadow: 0 0 0 rgba(255, 0, 0, 0);
            transition:
                transform 0.14s ease-in,
                background 0.14s ease-in,
                border-color 0.14s ease-in,
                box-shadow 0.14s ease-in;
        }

        /* Locked state: one press used for today */
        .press-button.locked {
            background:
                radial-gradient(circle at 35% 30%, #3a3a3a 0%, #222 40%, #111 100%);
            border-color: #333;
            box-shadow:
                inset 0 3px 12px rgba(255, 255, 255, 0.08),
                inset 0 -10px 20px rgba(0, 0, 0, 0.4);
            cursor: default;
        }

        .press-button.locked:hover {
            box-shadow:
                inset 0 3px 12px rgba(255, 255, 255, 0.08),
                inset 0 -10px 20px rgba(0, 0, 0, 0.4);
        }

        .press-button.locked:active {
            transform: none;
        }

        .press-button.busy {
            opacity: 0.85;
        }

        .press-label {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 5px;
            margin-left: 5px;
            text-align: center;
            line-height: 1.4;
        }

        .press-button.locked .press-label {
            color: #aaaaaa;
            font-size: 11px;
            letter-spacing: 3px;
        }

        /* =========================
           MYSTERY MESSAGE
        ========================= */

        .message {
            min-height: 38px;
            margin-top: 34px;

            color: #ff3333;
            font-size: clamp(16px, 3.2vw, 24px);
            font-weight: 700;
            letter-spacing: 6px;
            margin-right: -6px;

            text-align: center;
            text-transform: uppercase;
            text-shadow:
                0 0 16px rgba(255, 51, 51, 0.45),
                0 0 36px rgba(255, 51, 51, 0.2);

            opacity: 0;
            transform: translateY(8px);
            transition:
                opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                color 0.4s ease,
                text-shadow 0.4s ease;
        }

        .message.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .message.dim {
            color: #aaaaaa;
            font-size: clamp(11px, 2vw, 13px);
            font-weight: 400;
            letter-spacing: 4px;
            margin-right: -4px;
            text-shadow: none;
        }

        /* =========================
           GHOST SIGHTINGS
        ========================= */

        .ghost-sighting {
            position: fixed;
            top: 24px;
            transform: translateY(-10px);

            color: #999999;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            white-space: nowrap;

            z-index: 5;
            pointer-events: none;

            opacity: 0;
            transition:
                opacity 0.6s ease,
                transform 0.6s ease;
        }

        .ghost-sighting.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            width: 100%;
            text-align: center;
            z-index: 2;
        }

        .world {
            font-size: 11px;
            color: #aaaaaa;
            letter-spacing: 3px;
            margin-bottom: 18px;
        }

        .world strong {
            color: #aaaaaa;
            font-weight: 400;
        }

        .why {
            display: inline-block;

            color: #aaaaaa;
            font-size: 10px;
            letter-spacing: 3px;

            text-decoration: none;

            border-bottom: 1px dotted #aaaaaa;
            padding-bottom: 3px;

            transition:
                color 0.3s ease,
                border-color 0.3s ease;
        }

        .why:hover {
            color: #fff;
            border-color: #fff;
        }

        .world-pulse {
            display: inline-flex;
            align-items: center;
            gap: 6px;

            margin-left: 16px;

            background: transparent;
            border: none;
            padding: 0;
            cursor: pointer;

            color: #aaaaaa;
            font-size: 10px;
            letter-spacing: 2px;

            transition: color 0.3s ease;
        }

        .world-pulse:hover {
            color: #fff;
        }

        .world-pulse-dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;

            background: #ff3333;
            box-shadow: 0 0 8px 2px rgba(255, 51, 51, 0.6);

            animation: worldPulse 2s ease-in-out infinite;
        }

        @keyframes worldPulse {

            0%, 100% {
                transform: scale(1);
                opacity: 1;
                box-shadow: 0 0 6px 2px rgba(255, 51, 51, 0.5);
            }

            50% {
                transform: scale(1.5);
                opacity: 0.7;
                box-shadow: 0 0 16px 6px rgba(255, 51, 51, 0.8);
            }

        }

        /* =========================
           FX CANVAS (Reality Break)
        ========================= */

        #fx-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;

            z-index: 15;
            pointer-events: none;

            opacity: 0;
        }

        #fx-canvas.active {
            opacity: 1;
        }

        /* Full-screen distortion flash used during BURST phase */
        .fx-flash {
            position: fixed;
            inset: 0;

            opacity: 0;
            pointer-events: none;
            z-index: 14;

            mix-blend-mode: screen;
        }

        .fx-flash.active {
            animation: fxFlash 0.55s ease-out;
        }

        @keyframes fxFlash {
            0% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        /* =========================
           MILESTONE SCREEN
        ========================= */

        .overlay {
            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.97);

            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 20;

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.5s ease,
                visibility 0.5s ease;
        }

        .overlay.open {
            opacity: 1;
            visibility: visible;
        }

        /* THE WORLD overlay only — floating card, not a fullscreen dimmer.
           Scoped to #worldOverlay so the WHY 86? overlay (.overlay) is untouched. */
        #worldOverlay {
            top: auto;
            left: auto;
            right: 24px;
            bottom: 24px;

            max-width: 320px;
            width: calc(100vw - 48px);

            background: rgba(15, 15, 15, 0.97);
            border-radius: 14px;
            box-shadow:
                0 12px 40px rgba(0, 0, 0, 0.6),
                0 0 30px rgba(255, 40, 40, 0.12);

            transform: translateY(20px);

            transition:
                opacity 0.35s ease,
                transform 0.35s ease,
                visibility 0.35s ease;
        }

        #worldOverlay.open {
            transform: translateY(0);
        }

        .overlay-content {
            text-align: center;
            padding: 30px;
        }

        .overlay-number {
            color: #aaaaaa;
            font-size: 11px;
            letter-spacing: 5px;
            margin-bottom: 25px;
        }

        .overlay-title {
            font-size: clamp(25px, 5vw, 48px);
            letter-spacing: 2px;
            font-weight: 700;
        }

        .overlay-subtitle {
            margin-top: 20px;
            color: #aaaaaa;
            font-size: 11px;
            letter-spacing: 3px;
        }

        .overlay-footnote {
            margin-top: 30px;
            color: #555;
            font-size: 9px;
            letter-spacing: 2px;
        }

        .close {
            margin-top: 45px;

            background: transparent;
            border: none;

            color: #aaaaaa;

            font-family: inherit;
            font-size: 10px;
            letter-spacing: 3px;

            cursor: pointer;

            transition: color 0.3s ease;
        }

        .close:hover {
            color: white;
        }

        .world-countries {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .world-country-row {
            color: #aaaaaa;
            font-size: 12px;
            letter-spacing: 2px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {
                overflow-y: auto;
            }

            .page {
                padding-top: 28px;
                padding-bottom: 24px;
                min-height: 100vh;
                height: auto;
            }

            .button-wrap {
                width: 210px;
                height: 210px;
            }

            .press-button {
                width: 175px;
                height: 175px;
            }

            main {
                margin-top: -10px;
            }

            .counter {
                margin-bottom: 26px;
            }

            .message {
                margin-top: 24px;
                font-size: 15px;
                letter-spacing: 4px;
                margin-right: -4px;
            }

            .ghost-sighting {
                top: 6px;
                font-size: 9px;
            }
        }
    </style>
</head>

<body>

    <canvas id="fx-canvas"></canvas>
    <div id="fx-flash" class="fx-flash"></div>

    <div class="page" id="page">

        <div id="ghostSighting" class="ghost-sighting"></div>

        <!-- =========================
         HEADER
    ========================== -->

        <header>
            <div id="code" class="code">86 &lt; 86</div>
            <div class="logo" id="logo">
                86
                <span id="ghostCyan" class="logo-ghost cyan">86</span>
                <span id="ghostRed" class="logo-ghost red">86</span>
            </div>
        </header>


        <!-- =========================
         CENTER
    ========================== -->

        <main>

            <div class="counter">
                <span id="total">0</span> PRESSES
            </div>

            <div class="button-wrap">

                <button id="pressButton" class="press-button" aria-label="Press the button">
                    <span id="pressLabel" class="press-label">PRESS</span>
                </button>

            </div>

            <div id="message" class="message"></div>

        </main>


        <!-- =========================
         FOOTER
    ========================== -->

        <footer>

            <div class="world">
                <strong id="today">0</strong> PRESSES TODAY
            </div>

            <a href="#" id="why" class="why">
                WHY 86?
            </a>

            <button id="worldLink" class="world-pulse" aria-label="View world activity">
                <span class="world-pulse-dot"></span>
                <span id="worldPulseCount">0</span>
            </button>

        </footer>

    </div>


    <!-- =========================
     WHY 86 OVERLAY
========================== -->

    <div id="overlay" class="overlay">

        <div class="overlay-content">

            <div class="overlay-number">
                86
            </div>

            <div class="overlay-title" id="overlayTitle">
                WHY?
            </div>

            <div class="overlay-subtitle" id="overlaySubtitle">
                THERE IS NO ANSWER.
            </div>

            <div class="overlay-footnote">
                NO ACCOUNTS. NO DOWNLOADS. NOTHING STORED BUT YOUR COUNTRY.
            </div>

            <button id="close" class="close">
                CLOSE
            </button>

        </div>

    </div>


    <!-- =========================
     THE WORLD OVERLAY
========================== -->

    <div id="worldOverlay" class="overlay">

        <div class="overlay-content">

            <div class="overlay-number">
                THE WORLD
            </div>

            <div id="worldBody">

                <div class="overlay-title" id="worldTotal">
                    0
                </div>

                <div class="world-countries" id="worldCountries"></div>

                <div class="overlay-subtitle" id="worldCountryCount">
                    0 COUNTRIES HAVE PRESSED
                </div>

            </div>

            <div class="overlay-subtitle" id="worldError" style="display: none;">
                COULD NOT LOAD THE WORLD.
            </div>

            <button id="closeWorld" class="close">
                CLOSE
            </button>

        </div>

    </div>


    <script>

        /* ==========================================
           INITIAL STATE & CONFIG
        ========================================== */

        // HTTPS reverse-proxy domain for Nginx / Caddy + Let's Encrypt
        const API_BASE = "https://p86-api.foto-post-weltweit.de";

        let worldClicks = 0; // filled in from the server on load

        const TOKEN_KEY = "86_client_token";
        const STORAGE_KEY = "86_press_state";

        /* ==========================================
           CLIENT TOKEN

           A random, non-identifying id generated once
           per browser and sent to the server so it can
           enforce one press per day. Not tied to any
           personal data.
        ========================================== */

        function getOrCreateClientToken() {
            let token = localStorage.getItem(TOKEN_KEY);
            if (!token || token.length < 16) {
                token = crypto.randomUUID
                    ? crypto.randomUUID()
                    : "t_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
                localStorage.setItem(TOKEN_KEY, token);
            }
            return token;
        }

        const clientToken = getOrCreateClientToken();

        /* ==========================================
           ELEMENTS
        ========================================== */

        const button = document.getElementById("pressButton");
        const pressLabel = document.getElementById("pressLabel");

        const total = document.getElementById("total");
        const today = document.getElementById("today");

        const message = document.getElementById("message");

        const code = document.getElementById("code");

        const ghostCyan = document.getElementById("ghostCyan");
        const ghostRed = document.getElementById("ghostRed");

        const fxCanvas = document.getElementById("fx-canvas");
        const fxCtx = fxCanvas.getContext("2d");
        const fxFlash = document.getElementById("fx-flash");

        const page = document.getElementById("page");

        const why = document.getElementById("why");
        const overlay = document.getElementById("overlay");
        const overlayTitle = document.getElementById("overlayTitle");
        const overlaySubtitle = document.getElementById("overlaySubtitle");
        const closeBtn = document.getElementById("close");

        const worldLink = document.getElementById("worldLink");
        const worldPulseCount = document.getElementById("worldPulseCount");
        const worldOverlay = document.getElementById("worldOverlay");
        const worldBody = document.getElementById("worldBody");
        const worldTotal = document.getElementById("worldTotal");
        const worldCountries = document.getElementById("worldCountries");
        const worldCountryCount = document.getElementById("worldCountryCount");
        const worldError = document.getElementById("worldError");
        const closeWorldBtn = document.getElementById("closeWorld");


        /* ==========================================
           FORMAT NUMBER
        ========================================== */

        function formatNumber(number) {
            return Number(number || 0).toLocaleString("en-US");
        }

        function todayKey() {
            // Local calendar day, used only for the milestone counter
            // (totalDays). The real one-press-per-day boundary is enforced
            // by the server in UTC — this is not the security check.
            const d = new Date();
            return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
        }


        /* ==========================================
           COUNTRY HELPERS
        ========================================== */

        function flagEmoji(countryCode) {
            if (!countryCode || countryCode.length !== 2) return "";
            return countryCode.toUpperCase().replace(/./g, (char) =>
                String.fromCodePoint(127397 + char.charCodeAt(0))
            );
        }

        function countryName(countryCode) {
            try {
                return new Intl.DisplayNames(["en"], { type: "region" }).of(
                    countryCode.toUpperCase()
                );
            } catch (e) {
                return countryCode;
            }
        }

        /* ==========================================
           SHOW MESSAGE
        ========================================== */

        function showMessage(text, dim) {

            message.textContent = text;

            message.classList.remove("visible");
            message.classList.toggle("dim", !!dim);

            // Force animation restart
            void message.offsetWidth;

            message.classList.add("visible");

        }


        /* ==========================================
           PRESS STATE (milestone tracking only)

           This just counts "days I pressed" per browser
           for the 1/10/25/50/86 milestone messages. It is
           NOT what enforces one-press-per-day — the server
           does that via /api/status and /api/press.
        ========================================== */

        function loadPressState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : { lastDay: null, totalDays: 0 };
            } catch (e) {
                return { lastDay: null, totalDays: 0 };
            }
        }

        function savePressState(state) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                /* localStorage unavailable — milestone counting just won't persist */
            }
        }

        let pressState = loadPressState();

        function lockButtonForToday() {
            button.classList.add("locked");
            pressLabel.textContent = "YOU PRESSED.\nCOME BACK TOMORROW.";
            button.setAttribute("aria-disabled", "true");
        }

        function setBusy(isBusy) {
            button.classList.toggle("busy", isBusy);
            button.style.pointerEvents = isBusy ? "none" : "";
        }

        /* ==========================================
           LOAD STATE FROM SERVER

           Runs on page load: fetches the real global
           counter and checks (via the token) whether this
           browser already pressed today, so the button can
           be locked immediately instead of only after a
           wasted animation + a 409.
        ========================================== */

        async function loadServerState() {
            try {
                const statusRes = await fetch(
                    `${API_BASE}/api/status?token=${encodeURIComponent(clientToken)}`
                );
                if (!statusRes.ok) {
                    throw new Error("Server returned " + statusRes.status);
                }
                const status = await statusRes.json();

                worldClicks = typeof status.total === "number" ? status.total : 0;

                if (status.pressedToday) {
                    lockButtonForToday();
                    showMessage("YOU USED TODAY'S PRESS.", true);
                }

            } catch (e) {
                // Backend unreachable or offline — degrade gracefully rather than
                // leaving the page looking broken.
                showMessage("COULD NOT REACH THE SERVER.", true);
            }
        }

        loadServerState();


        /* ==========================================
           86-SHAPE TARGET POINTS
           Sampled once from an offscreen canvas so the
           particle burst has something to converge into.
        ========================================== */

        let shapePoints = [];

        function buildShapePoints() {

            const off = document.createElement("canvas");
            const size = 300;
            off.width = size;
            off.height = size;
            const octx = off.getContext("2d");

            octx.fillStyle = "#fff";
            octx.font = "bold 180px 'Space Mono', monospace";
            octx.textAlign = "center";
            octx.textBaseline = "middle";
            octx.fillText("86", size / 2, size / 2 + 10);

            const data = octx.getImageData(0, 0, size, size).data;
            const points = [];

            for (let y = 0; y < size; y += 4) {
                for (let x = 0; x < size; x += 4) {
                    const alpha = data[(y * size + x) * 4 + 3];
                    if (alpha > 128) {
                        points.push({
                            x: (x - size / 2) / size,
                            y: (y - size / 2) / size
                        });
                    }
                }
            }

            shapePoints = points;
        }

        buildShapePoints();


        /* ==========================================
           CANVAS SIZE
        ========================================== */

        function resizeCanvas() {
            fxCanvas.width = window.innerWidth;
            fxCanvas.height = window.innerHeight;
        }

        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);


        /* ==========================================
           CAMERA SHAKE
        ========================================== */

        function cameraShake(intensity, duration) {

            const start = performance.now();

            function tick(now) {
                const t = (now - start) / duration;

                if (t >= 1) {
                    page.style.transform = "translate(0, 0)";
                    return;
                }

                const decay = 1 - t;
                const dx = (Math.random() * 2 - 1) * intensity * decay;
                const dy = (Math.random() * 2 - 1) * intensity * decay;

                page.style.transform = `translate(${dx}px, ${dy}px)`;

                requestAnimationFrame(tick);
            }

            requestAnimationFrame(tick);
        }


        /* ==========================================
           CHROMATIC SHIFT
        ========================================== */

        function chromaticShift() {
            ghostCyan.classList.remove("active");
            ghostRed.classList.remove("active");

            void ghostCyan.offsetWidth;

            ghostCyan.classList.add("active");
            ghostRed.classList.add("active");
        }


        /* ==========================================
           FULL-SCREEN FLASH
        ========================================== */

        function screenFlash(color) {
            fxFlash.style.background = color;
            fxFlash.classList.remove("active");
            void fxFlash.offsetWidth;
            fxFlash.classList.add("active");
        }


        /* ==========================================
           REALITY BREAK — PARTICLE ENGINE
           Three variants, picked at random per press.
           Phases: BURST -> CONVERGE -> HOLD -> FADE
        ========================================== */

        const EFFECTS = {

            IMPACT: {
                color: () => Math.random() > 0.4 ? "255,60,40" : "255,255,255",
                burstSpeed: 6.5,
                gravity: 0,
                shake: 12,
                flash: "rgba(255,40,20,0.3)"
            },

            VOID: {
                color: () => Math.random() > 0.5 ? "30,30,30" : "255,255,255",
                burstSpeed: 3.2,
                gravity: 0,
                shake: 4,
                flash: "rgba(0,0,0,0.55)"
            },

            GRAVITY: {
                color: () => Math.random() > 0.5 ? "255,80,60" : "255,200,180",
                burstSpeed: 5.5,
                gravity: 0.08,
                shake: 8,
                flash: "rgba(255,60,40,0.22)"
            }

        };

        const EFFECT_NAMES = Object.keys(EFFECTS);

        function runRealityBreak(onDone) {

            const rect = button.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;

            const effectName = EFFECT_NAMES[Math.floor(Math.random() * EFFECT_NAMES.length)];
            const cfg = EFFECTS[effectName];

            cameraShake(cfg.shake, 600);
            screenFlash(cfg.flash);
            chromaticShift();

            // Scale the sampled 86-shape to a good on-screen size
            const shapeScale = Math.min(window.innerWidth, window.innerHeight) * 0.7;

            const count = shapePoints.length + 60;
            const particles = [];

            for (let i = 0; i < count; i++) {

                const angle = Math.random() * Math.PI * 2;
                const speed = (0.5 + Math.random()) * cfg.burstSpeed;

                const target = shapePoints[i % shapePoints.length];

                particles.push({
                    x: cx,
                    y: cy,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    targetX: cx + target.x * shapeScale,
                    targetY: cy + target.y * shapeScale,
                    color: cfg.color(),
                    size: 1.5 + Math.random() * 2
                });
            }

            fxCanvas.classList.add("active");

            const BURST_END = 500;
            const CONVERGE_END = 1400;
            const HOLD_END = 1900;
            const FADE_END = 2500;

            const start = performance.now();

            function easeOutCubic(t) {
                return 1 - Math.pow(1 - t, 3);
            }

            function frame(now) {

                const elapsed = now - start;

                fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);

                let alpha = 1;
                if (elapsed > HOLD_END) {
                    alpha = 1 - (elapsed - HOLD_END) / (FADE_END - HOLD_END);
                }
                alpha = Math.max(0, Math.min(1, alpha));

                if (elapsed <= BURST_END) {

                    const t = elapsed / BURST_END;
                    for (const p of particles) {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += cfg.gravity;
                        drawParticle(p, alpha);
                    }

                } else if (elapsed <= CONVERGE_END) {

                    const t = easeOutCubic((elapsed - BURST_END) / (CONVERGE_END - BURST_END));
                    for (const p of particles) {
                        const cxp = p.x + (p.targetX - p.x) * 0.08;
                        const cyp = p.y + (p.targetY - p.y) * 0.08;
                        p.x = cxp;
                        p.y = cyp;
                        drawParticle(p, alpha);
                    }

                } else if (elapsed <= HOLD_END) {

                    for (const p of particles) {
                        drawParticle(p, alpha);
                    }

                } else if (elapsed <= FADE_END) {

                    for (const p of particles) {
                        p.y += cfg.gravity > 0 ? 0.8 : 0;
                        drawParticle(p, alpha);
                    }

                } else {

                    fxCanvas.classList.remove("active");
                    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
                    onDone();
                    return;
                }

                requestAnimationFrame(frame);
            }

            requestAnimationFrame(frame);
        }

        function drawParticle(p, alpha) {
            fxCtx.beginPath();
            fxCtx.fillStyle = `rgba(${p.color},${alpha})`;
            fxCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            fxCtx.fill();
        }


        /* ==========================================
           PRESS-DAY MILESTONES
           Based on total days pressed (localStorage),
           not on clicks-per-session, since one press
           per day is the whole point.
        ========================================== */

        function handleMilestone(totalDays) {

            if (totalDays === 1) {
                showMessage("WELCOME TO 86.");
            } else if (totalDays === 10) {
                showMessage("TEN DAYS. STILL NO ANSWER.");
            } else if (totalDays === 25) {
                showMessage("YOU KEEP COMING BACK.");
            } else if (totalDays === 50) {
                showMessage("50 WAS NOT THE TARGET.");
            } else if (totalDays === 86) {

                showMessage("YOU FOUND IT.");
                code.textContent = "86 = 86";

                setTimeout(() => {
                    overlayTitle.textContent = "86 DAYS.";
                    overlaySubtitle.textContent = "YOU FOUND IT.";
                    overlay.classList.add("open");
                }, 900);

            } else if (totalDays > 86 && totalDays % 50 === 0) {
                showMessage("THE NUMBER CONTINUES.");
            } else {
                showMessage("YOU USED TODAY'S PRESS.", true);
            }
        }


        /* ==========================================
           BUTTON PRESS

           Sequence: collapse (0-140ms) -> reality break
           animation plays optimistically -> while it plays,
           the real press is sent to the server -> once both
           are done, the server's response decides the final
           state (locked + real total, or a friendly retry on
           error/race).
        ========================================== */

        button.addEventListener("click", () => {

            if (button.classList.contains("locked") || button.classList.contains("busy")) {
                return;
            }

            setBusy(true);

            // 0–140ms: button collapses to black
            button.classList.add("collapsing");

            setTimeout(() => {

                button.classList.remove("collapsing");

                // Fire the real press request now, in parallel with the
                // animation, so the visual doesn't wait on network latency.
                const pressRequest = fetch(`${API_BASE}/api/press`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token: clientToken })
                }).then(async (res) => {
                    const data = await res.json();
                    return { ok: res.ok, status: res.status, data };
                }).catch(() => {
                    return { ok: false, status: 0, data: null };
                });

                runRealityBreak(async () => {

                    const result = await pressRequest;
                    setBusy(false);

                    if (result.status === 409) {
                        // Another tab/device with the same token beat us to it today
                        lockButtonForToday();
                        if (result.data && typeof result.data.total === "number") {
                            worldClicks = result.data.total;
                            total.textContent = formatNumber(worldClicks);
                            today.textContent = formatNumber(worldClicks);
                        }
                        showMessage("YOU USED TODAY'S PRESS.", true);
                        return;
                    }

                    if (!result.ok || !result.data || !result.data.success) {
                        // Server unreachable or errored — let the user try again
                        // instead of silently eating their press.
                        showMessage("CONNECTION FAILED. TRY AGAIN.", true);
                        return;
                    }

                    worldClicks = result.data.total;
                    total.textContent = formatNumber(worldClicks);
                    today.textContent = formatNumber(worldClicks);

                    pressState.totalDays = (pressState.totalDays || 0) + 1;
                    pressState.lastDay = todayKey();
                    savePressState(pressState);

                    lockButtonForToday();

                    const flag = flagEmoji(result.data.yourCountry);
                    const name = countryName(result.data.yourCountry);
                    showMessage(`YOUR PRESS: ${flag} ${name.toUpperCase()}`);

                    setTimeout(() => {
                        handleMilestone(pressState.totalDays);
                    }, 2500);

                });

            }, 140);

        });


        /* ==========================================
           WHY 86
        ========================================== */

        why.addEventListener("click", (event) => {

            event.preventDefault();

            overlayTitle.textContent = "WHY?";
            overlaySubtitle.textContent = "THERE IS NO ANSWER.";
            overlay.classList.add("open");

        });


        /* ==========================================
           THE WORLD

           Fetches world press stats from the server and
           opens the world overlay. On a network error it
           shows a plain in-panel message instead of
           disturbing the rest of the page.
        ========================================== */

        /* ==========================================
           WORLD PULSE COUNT

           One-off fetch on page load so the footer dot
           shows the real total instead of "0" before the
           panel has ever been opened.
        ========================================== */

        async function loadWorldPulseCount() {
            try {
                const res = await fetch(`${API_BASE}/api/stats`);
                if (!res.ok) {
                    throw new Error("Server returned " + res.status);
                }
                const data = await res.json();
                worldClicks = typeof data.total === "number" ? data.total : 0;
                const formattedTotal = formatNumber(worldClicks);
                worldPulseCount.textContent = formattedTotal;
                total.textContent = formattedTotal;
                today.textContent = formattedTotal;
            } catch (e) {
                // Leave it at "0" — not worth disturbing the page for this.
            }
        }

        loadWorldPulseCount();
        setInterval(loadWorldPulseCount, 8000);

        /* ==========================================
           GHOST SIGHTINGS

           Periodically flashes a real recent press from
           another visitor ("JAPAN JUST PRESSED"). Silent
           no-op on empty data or network failure — this is
           ambience, not a critical feature.
        ========================================== */

        const ghostSighting = document.getElementById("ghostSighting");

        async function showGhostSighting() {
            try {
                const res = await fetch(`${API_BASE}/api/recent`);
                if (!res.ok) {
                    throw new Error("Server returned " + res.status);
                }
                const data = await res.json();
                const recent = data.recent || [];
                if (recent.length === 0) {
                    return;
                }

                const pool = recent.slice(0, 10);
                const entry = pool[Math.floor(Math.random() * pool.length)];

                const flag = flagEmoji(entry.code);
                const name = countryName(entry.code);
                ghostSighting.textContent = `${flag} ${name.toUpperCase()} JUST PRESSED`;
                const onLeft = Math.random() < 0.5;
                ghostSighting.style.left = onLeft ? "24px" : "";
                ghostSighting.style.right = onLeft ? "" : "24px";
                ghostSighting.classList.add("visible");

                setTimeout(() => {
                    ghostSighting.classList.remove("visible");
                }, 3500);

            } catch (e) {
                // Backend unreachable — just skip this sighting.
            }
        }

        setInterval(showGhostSighting, 9000);

        async function loadWorldPanel() {

            try {

                const res = await fetch(`${API_BASE}/api/world`);
                if (!res.ok) {
                    throw new Error("Server returned " + res.status);
                }
                const data = await res.json();

                worldTotal.textContent = formatNumber(data.total);

                worldCountries.innerHTML = "";
                (data.topCountries || []).forEach((entry) => {
                    const flag = flagEmoji(entry.code);
                    const name = countryName(entry.code);
                    const row = document.createElement("div");
                    row.className = "world-country-row";
                    row.textContent = `${flag} ${name.toUpperCase()} — ${entry.count}`;
                    worldCountries.appendChild(row);
                });

                worldCountryCount.textContent =
                    `${formatNumber(data.countryCount)} COUNTRIES HAVE PRESSED`;

                worldBody.style.display = "";
                worldError.style.display = "none";
                worldOverlay.classList.add("open");

            } catch (e) {

                worldBody.style.display = "none";
                worldError.style.display = "";
                worldOverlay.classList.add("open");

            }

        }

        worldLink.addEventListener("click", (event) => {

            event.preventDefault();
            loadWorldPanel();

        });

        closeWorldBtn.addEventListener("click", () => {

            worldOverlay.classList.remove("open");

        });


        /* ==========================================
           CLOSE OVERLAY
        ========================================== */

        closeBtn.addEventListener("click", () => {

            overlay.classList.remove("open");

        });


        /* ==========================================
           ESC KEY
        ========================================== */

        document.addEventListener("keydown", (event) => {

            if (event.key === "Escape") {

                overlay.classList.remove("open");
                worldOverlay.classList.remove("open");

            }

        });

        /* ==========================================
           DEBUG HELPER
        ========================================== */

        window.reset86 = function () {
            localStorage.removeItem(TOKEN_KEY);
            localStorage.removeItem(STORAGE_KEY);
            location.reload();
        };

    </script>
